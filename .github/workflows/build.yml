name: DroidBox CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore DroidBox.sln

    - name: Build solution
      run: dotnet build DroidBox.sln -c Release --no-restore

    - name: Run test suite
      run: dotnet test DroidBox.sln -c Release --no-build --verbosity normal
